name: My second ci pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: Run test
        run: pytest

      - name: Build docker image
        run: docker build -t myapp:${{ github.run_number }} .

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deploy to staging
        run: echo "Deploying myapp:${{ github.run_number }} to STAGING environment"
