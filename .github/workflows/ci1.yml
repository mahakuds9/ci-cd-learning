name: My First CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      STAGING_ENV: staging
      PRODUCTION_ENV: production
      
    steps:
        
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Setup the python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          echo "Running in the $STAGING_ENV mode"
          echo "Running in the $PRODUCTION_ENV mode"
          
      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: Run tests
        run: pytest
